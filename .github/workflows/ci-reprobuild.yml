name: CI (reprobuild)

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Cancel superseded PR checks while preserving every mainline run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  choose-linux:
    # The shared CI_RUNNER_MODE policy selects free hosted runners for public
    # repos by default and preserves the org-controlled self-hosted fallback.
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-choose-runner.yml@cd73eba732b9190499ec78e1e65b0dd784507440
    with:
      preferred: ubuntu-24.04
      fallback: '["self-hosted","linux","x64"]'

  reprobuild:
    needs: choose-linux
    name: Repro build/test (${{ join(matrix.runner, '-') }}) ${{ contains(matrix.runner, 'windows') && contains(matrix.runner, 'arm64') && '(x64 emulation)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64]
          - [self-hosted, linux, arm64]
          - [self-hosted, macos, arm64, nix-darwin]
          - [self-hosted, windows, x64]
          - [self-hosted, windows, arm64]
    # Source bootstrap exceeds the current Tart guest's writable storage.
    # The native nix-darwin class retains every test; owner zah, follow-up:
    # metacraft-specs/issues/2026-09-29-macos-tart-source-bootstrap-exhausts-guest-disk.md
    # Temporary native Linux ARM64 migration for this build/test job; owner: zah.
    # Follow-up: metacraft-specs/issues/2026-09-28-release-linux-arm64-runner-migration.md
    runs-on: ${{ contains(matrix.runner, 'linux') && contains(matrix.runner, 'x64') && fromJSON(needs.choose-linux.outputs.runs_on) || (contains(matrix.runner, 'linux') && contains(matrix.runner, 'arm64') && 'ubuntu-24.04-arm' || matrix.runner) }}
    env:
      # Reprobuild and its monitor currently target x64 on Windows, including
      # the existing emulated lane on ARM64 hosts. Native release payloads
      # are built and exercised separately by the release workflow.
      WINDOWS_DIY_ARCH_OVERRIDE: ${{ contains(matrix.runner, 'windows') && contains(matrix.runner, 'arm64') && 'x64' || '' }}
    # Source bootstrap reached the 90-minute job limit on loaded fleet hosts
    # at 63680f8 before product tests began. Keep the full test matrix.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token
        id: ci-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup reprobuild environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@2f1abf5e4e2102f2a9abe1ea9a0f3b4097ec9717
        with:
          env-flavor: reprobuild
          # Exercise the published bootstrap repairs before a new CLI release.
          # Windows ARM64 keeps the existing emulated x64 Reprobuild tools.
          repro-from-source: true
          repro-build-pin: 90dc43218b00f2a1a7de94c174fb849f21b3a377
          gh-token: ${{ steps.ci-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Refresh authentication before Repro build
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Repro build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs
          dev-exec repro build 2>&1 | tee test-logs/repro-build.log

      - name: Refresh authentication before Repro test
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Repro test
        shell: bash
        run: |
          set -euo pipefail
          dev-exec repro test 2>&1 | tee test-logs/repro-test.log

      # The two steps above capture only reprobuild's own stdout. When an
      # action fails, the engine has already written that child's raw stdio
      # to .repro/build/<name>/build-engine-cache/actions/<id>.stderr.log
      # (and .stdout.log), and -- for a failure that got as far as
      # scheduling actions -- a post-mortem to
      # .repro/build/<name>/build-failure-report.json. Neither is reachable
      # from test-logs/, and .repro/ is a dot-directory that
      # upload-artifact excludes by default, so without this step a red
      # build ships its summary and none of the evidence behind it.
      #
      # This folds the small, high-value subset into test-logs/ rather than
      # adding globs to the upload step: the S3 mirror below takes ONE
      # existing path, not a glob list, so a glob-only fix would never
      # reach it -- and with retention-days: 1 the mirror is the copy that
      # outlives the run.
      - name: Collect reprobuild diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Deliberately no -e: this is a best-effort collector, and one
          # unreadable log must not cost us the rest of the post-mortem.
          set -uo pipefail
          # Source bootstrap roots Python on POSIX, even when the action PATH
          # lacks find. Windows retains the existing PortableGit collector.
          if [ -n "${REPROBUILD_BOOTSTRAP_PYTHON:-}" ]; then
            "$REPROBUILD_BOOTSTRAP_PYTHON" scripts/collect-repro-diagnostics.py
            exit "$?"
          fi
          dest=test-logs/repro-diagnostics
          mkdir -p "$dest"
          collected=0
          for outdir in .repro/build/*; do
            [ -d "$outdir" ] || continue
            name=$(basename "$outdir")
            if [ -f "$outdir/build-failure-report.json" ]; then
              mkdir -p "$dest/$name"
              cp "$outdir/build-failure-report.json" "$dest/$name/"
              collected=$((collected + 1))
            fi
            actions="$outdir/build-engine-cache/actions"
            [ -d "$actions" ] || continue
            # Copy the directory in ONE process, then drop the empty
            # captures: a real tree holds ~3000 of these of which ~200
            # carry any bytes, and an empty capture says nothing the
            # failure report and the tee'd log do not already say.
            # Per-file `-exec cp {} ... ;` was measured at ~1.5s/spawn on
            # a Windows shell, i.e. minutes for one build -- both `cp -R`
            # and `-exec rm {} +` are batched and stay portable to the
            # macOS legs (no GNU-only flags).
            rm -rf "$dest/$name/actions"
            mkdir -p "$dest/$name"
            cp -R "$actions" "$dest/$name/actions"
            find "$dest/$name/actions" -type f -size 0c -exec rm -f {} +
            n=$(find "$dest/$name/actions" -type f | wc -l | tr -d '[:space:]')
            collected=$((collected + ${n:-0}))
          done
          # Always leave a file behind. An empty test-logs/ makes BOTH sinks
          # below report success while transferring nothing -- the same
          # silent success this step exists to remove.
          listing=$(find "$dest" -type f | LC_ALL=C sort)
          {
            echo "job: ${GITHUB_JOB:-?}  runner: ${RUNNER_OS:-?}/${RUNNER_ARCH:-?}"
            echo "collected: $collected"
            printf '%s\n' "$listing"
          } > "$dest/collection-summary.txt"
          echo "collected $collected reprobuild diagnostic file(s) into $dest"
          if [ "$collected" -eq 0 ]; then
            echo "::warning title=Reprobuild diagnostics::no build-failure-report.json and no non-empty per-action stdio under .repro/build/*; only the tee'd step logs are available"
          fi

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: test-logs/
          prefix: reprobuild-logs-${{ join(matrix.runner, '-') }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
