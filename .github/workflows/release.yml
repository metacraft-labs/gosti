name: Release

on:
  workflow_dispatch:
  push:
    branches: [release/unified-0.1.0]
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@9b68619e091df77a9d7bc7c099fa427bd2d07cfc
    with:
      tooling-ref: 9b68619e091df77a9d7bc7c099fa427bd2d07cfc
      nix-shell: release
    secrets: inherit
