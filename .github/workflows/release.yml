name: Release

on:
  workflow_dispatch:
  push:
    branches: [release/unified-0.1.0]
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@fec4aa78eff905596f2bd1ca7b9a0c370c2f74ca
    with:
      tooling-ref: fec4aa78eff905596f2bd1ca7b9a0c370c2f74ca
      nix-shell: release
    secrets: inherit
