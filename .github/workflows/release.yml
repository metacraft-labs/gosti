  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@47f06a5e5f7e497d7a098889fda5cebf3dda8020
    with:
      tooling-ref: 47f06a5e5f7e497d7a098889fda5cebf3dda8020
    secrets: inherit
