name: Release

on:
  workflow_dispatch:
  push:
    branches: [release/unified-0.1.0]
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@7bc6271c3cb5d1b91d10179a93465050338e477e
    with:
      tooling-ref: 7bc6271c3cb5d1b91d10179a93465050338e477e
      nix-shell: release
    secrets: inherit
