name: Release

on:
  workflow_dispatch:
  push:
    branches: [release/unified-0.1.0]
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@7f7bc6acd818fa88cde01a5985977e4c818c7eaa
    with:
      tooling-ref: 7f7bc6acd818fa88cde01a5985977e4c818c7eaa
      nix-shell: release
    secrets: inherit
