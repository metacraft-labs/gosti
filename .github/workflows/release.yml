name: Release

on:
  workflow_dispatch:
  push:
    branches: [release/unified-0.1.0]
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metacraft-labs/metacraft-github-actions/.github/workflows/release-tools.yml@ffd536533d0d5055348884221d13a40c49ec34d8
    with:
      tooling-ref: ffd536533d0d5055348884221d13a40c49ec34d8
    secrets: inherit
