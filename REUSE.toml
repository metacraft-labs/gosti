# REUSE (https://reuse.software) licensing metadata for files that cannot
# carry an in-file SPDX comment header without changing what they are:
# prose, data consumed verbatim by Windows/cloud-init, recorded test
# evidence, lock files, and binary/vector assets.
#
# Every *source* file (Nim, shell, PowerShell, Python, Nix, YAML, Justfile)
# carries its own `SPDX-License-Identifier` header instead, and is
# deliberately NOT matched here — so a new source file without a header
# fails `reuse lint` (run by `just lint`) rather than being silently
# covered by a blanket glob.
version = 1

# --- First-party prose, data, and recorded evidence -----------------------

[[annotations]]
path = [
  "NOTICE",
  "**/*.md",
  "flake.lock",
  "docs/site/flake.lock",
  "golden-outputs/**",
  "tests/e2e/**/evidence/**",
  "tests/e2e/**/*.tmpl",
  "guest-recipes/**/*.xml",
  "guest-recipes/**/*.reg",
  "guest-recipes/**/*.conf",
  "guest-recipes/**/*.targets",
  "docs/site/static/img/ct-search-icon.svg",
  "docs/site/static/img/icon-dark-circle.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Metacraft Labs / Schelling Point Labs"
SPDX-License-Identifier = "Apache-2.0"

# --- Third-party assets used by the documentation site --------------------
# These keep their upstream licenses; they are not relicensed.

[[annotations]]
path = "docs/site/static/fonts/Geist-Variable.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/site/static/img/icon__github.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Fonticons, Inc. (Font Awesome Free, https://fontawesome.com)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "docs/site/static/img/icon__components.svg",
  "docs/site/static/img/icon__faq.svg",
  "docs/site/static/img/icon__start.svg",
  "docs/site/static/img/icon__style.svg",
  "docs/site/static/img/icon__support.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC (Material Symbols, https://fonts.google.com/icons)"
SPDX-License-Identifier = "Apache-2.0"
